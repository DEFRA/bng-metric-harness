name: Check out the backend under test
description: >-
  Check out bng-metric-backend at the commit under test, under the runner's
  temp directory, install it, and name it in BNG_BACKEND_DIR for the steps
  that follow.

# Shared by the workflows that run the backend's code in process: the metric
# comparison and the example file uploads. Each reads the backend from
# BNG_BACKEND_DIR (scripts/metric-comparison/backend.mjs) in place of the
# sibling a developer has beside the harness.
#
# The checkout is under the runner's temp directory, not beside the
# workspace: the workspace is named after the repo whose run this is, so when
# the backend calls a workflow a "../bng-metric-backend" beside it is the
# workspace itself, and the backend checkout would overwrite the harness's.
#
# The commit is resolved first and that commit checked out, so a job summary
# names exactly what ran even if a merge lands mid-run:
# - backend-sha given (the backend's caller names its commit): that commit.
# - Otherwise the backend branch named pr-branch, if there is one, otherwise
#   main. The branch is looked up by its full ref: a bare name is a glob on
#   the tail of a ref, so "fix" would match a backend branch "alice/fix" as
#   well. A merge group has no head branch, so it runs the backend's main.

inputs:
  backend-sha:
    description: The bng-metric-backend commit to check out, as a full sha (default resolved from pr-branch)
    required: false
    default: ''
  backend-ref:
    description: What to call that commit (a branch name, say)
    required: false
    default: ''
  pr-branch:
    description: The pull request's head branch, to look for a backend branch of the same name
    required: false
    default: ''

outputs:
  ref:
    description: The backend branch, or the name the caller gave its commit
    value: ${{ steps.backend.outputs.ref }}
  sha:
    description: The backend commit checked out
    value: ${{ steps.backend.outputs.sha }}

runs:
  using: composite
  steps:
    - name: Check out and install the backend
      id: backend
      shell: bash
      env:
        BACKEND_URL: https://github.com/DEFRA/bng-metric-backend.git
        BACKEND_DIR: ${{ runner.temp }}/bng-metric-backend
        PR_BRANCH: ${{ inputs.pr-branch }}
        INPUT_SHA: ${{ inputs.backend-sha }}
        INPUT_REF: ${{ inputs.backend-ref }}
      run: |
        if [ -n "$INPUT_SHA" ]; then
          sha="$INPUT_SHA"
          ref="${INPUT_REF:-$INPUT_SHA}"
        else
          ref=main
          if [ -n "$PR_BRANCH" ] && git ls-remote --exit-code "$BACKEND_URL" "refs/heads/$PR_BRANCH" > /dev/null; then
            ref="$PR_BRANCH"
          fi
          sha=$(git ls-remote --exit-code "$BACKEND_URL" "refs/heads/$ref" | cut -f1)
        fi
        if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Could not resolve bng-metric-backend@$ref to a single commit: '$sha'"
          exit 1
        fi
        echo "Running bng-metric-backend@$ref ($sha)"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "BNG_BACKEND_DIR=$BACKEND_DIR" >> "$GITHUB_ENV"
        git init --quiet "$BACKEND_DIR"
        cd "$BACKEND_DIR"
        git fetch --quiet --depth 1 "$BACKEND_URL" "$sha"
        git checkout --quiet FETCH_HEAD
        # As the backend's own CI does: min-release-age collides with the
        # git-dependency prepare step npm runs for bng-library
        # (npm/cli#9005), and npm ci installs exact locked versions anyway.
        sed -i '/^min-release-age=/d' .npmrc
        npm ci
