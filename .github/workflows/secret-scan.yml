name: Secret Scan

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  # Run against the merge queue's temporary branch so the scan covers the
  # merge commit the queue actually merges, matching the sibling repos.
  merge_group:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  trufflehog:
    name: trufflehog (verified only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: trufflehog
        uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e # v3.99.3
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          extra_args: --only-verified
          # Pin the scanner image by digest as well as tag — without this, the action defaults to `latest`.
          version: 3.95.3@sha256:9cc33bb080cac0efbbf228a17667172875b529eeeab01efcc4697adfb55f568a
