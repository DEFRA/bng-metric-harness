name: Check Pull Request

on:
  schedule:
    - cron: '0 7 * * 1'
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The Python the committed bng-500/ files were converted with, so a
      # runner image's new Python cannot change them.
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'

      # The corpus's bng-500/ files are converted by bng-metric-template's
      # converter, at the commit scripts/service-template/convert.mjs pins.
      - name: Check out the template converter
        run: |
          commit=$(node --input-type=module -e "import { CONVERTER_COMMIT } from './scripts/service-template/convert.mjs'; console.log(CONVERTER_COMMIT)")
          git clone --quiet https://github.com/DEFRA/bng-metric-template.git "$RUNNER_TEMP/bng-metric-template"
          git -C "$RUNNER_TEMP/bng-metric-template" checkout --quiet "$commit"
          echo "BNG_TEMPLATE_DIR=$RUNNER_TEMP/bng-metric-template" >> "$GITHUB_ENV"

      - name: Run harness script tests
        run: npm run test:scripts
        env:
          REQUIRE_CONVERTER: "true"

      - name: SonarCloud Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v8.3.0 #  (or check latest version on https://github.com/marketplace/actions/official-sonarqube-scan)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
